<title>Family Judaic Curriculum — Fall 2026</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --ink: #26352E;
    --paper: #FBF8F1;
    --line: #D8CFBA;
    --green: #3E5C4E;
    --apricot: #D98E5F;
    --muted: #6B7268;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    line-height: 1.55;
  }
  .page {
    max-width: 840px;
    margin: 0 auto;
    padding: 48px 24px 100px;
  }
  h1 { font-size: 30px; margin: 0 0 4px; }
  h2 { font-size: 21px; color: var(--green); margin: 0 0 6px; border-bottom: 2px solid var(--line); padding-bottom: 8px; }
  .subtitle { color: var(--muted); font-size: 15px; margin: 0 0 40px; }
  .phase { margin-bottom: 52px; }
  .source-note {
    background: #F1ECDD;
    border-left: 3px solid var(--apricot);
    padding: 12px 16px;
    border-radius: 0 6px 6px 0;
    font-size: 14px;
    margin: 16px 0 24px;
  }
  .source-note b { color: var(--green); }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-top: 8px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--line); }
  td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .parsha-name { font-weight: 700; }
  .parsha-heb { color: var(--muted); font-size: 13px; }
  .date-cell { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  .block { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
  .block-head { font-weight: 700; color: var(--green); margin-bottom: 4px; }
  .block-window { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .reading-tag { display: inline-block; background: #E8E1CC; color: var(--green); font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; margin-bottom: 8px; }
  .no-reading-tag { display: inline-block; background: transparent; color: var(--muted); font-size: 12px; font-style: italic; padding: 3px 0; margin-bottom: 8px; }
  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

  /* ── Site nav (shared with /torah-chain) ───────────────────────────── */
  .site-nav {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    padding: 12px 16px;
    background: #F1ECDD;
    border-bottom: 1px solid var(--line);
  }
  .site-nav a { color: var(--green); text-decoration: none; }
  .site-nav a:hover { text-decoration: underline; }
  .site-nav a[aria-current="page"] { color: var(--apricot); }

  @media (max-width: 600px) {
    .page { padding: 28px 16px 72px; }
    h1 { font-size: 25px; }
    h2 { font-size: 19px; }
    table { font-size: 14px; }
    th, td { padding: 10px 8px; }
    .block { padding: 12px 13px; }
  }
</style>
</head>

<script>
(function () {
  const data = JSON.parse(document.getElementById('curriculum-data').textContent);

  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // "2026-10-10" -> "Oct 10, 2026". Parsed by hand so no timezone shift can
  // move a Shabbat onto the wrong day.
  function formatDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return `${MONTHS[m - 1]} ${d}, ${y}`;
  }

  function set(id, html) {
    document.getElementById(id).innerHTML = html;
  }

  document.title = data.title;
  set('doc-title', data.title);
  set('doc-subtitle', data.subtitle);
  set('phase-1-heading', data.phase1.heading);
  set('phase-1-source', data.phase1.sourceNote);
  set('phase-2-heading', data.phase2.heading);
  set('phase-2-source', data.phase2.sourceNote);
  set('doc-footer', data.ongoing.note);

  const blocksEl = document.getElementById('phase-1-blocks');
  data.phase1.blocks.forEach(b => {
    const el = document.createElement('div');
    el.className = 'block';
    el.innerHTML = `
      <div class="block-head">${b.title}</div>
      <div class="block-window">${b.window}</div>
      <span class="${b.hasReading ? 'reading-tag' : 'no-reading-tag'}">${b.tag}</span>
      <div>${b.body}</div>
    `;
    blocksEl.appendChild(el);
  });

  const tbody = document.getElementById('parsha-table-body');
  data.phase2.parshiot.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="date-cell">${formatDate(p.date)}</td>
      <td><span class="parsha-name">${p.parsha}</span><br><span class="parsha-heb">${p.heb}</span></td>
      <td>${p.theme}</td>
    `;
    tbody.appendChild(tr);
  });
})();
</script>
